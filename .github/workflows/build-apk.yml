# Builds the Android APK on GitHub's servers (free).
# - Every push to main → APK in Actions artifacts (needs GitHub login).
# - Every tag like v1.0.0 → public GitHub Release with SyncTimer.apk
#   (direct download link, no login needed — this is the link for users).
#
# REQUIRED for live sync inside the APK: add these 5 repository secrets
# (GitHub repo → Settings → Secrets and variables → Actions → New secret).
# Without them the APK still builds but runs in demo mode (same-device only).
#   VITE_FIREBASE_API_KEY
#   VITE_FIREBASE_AUTH_DOMAIN
#   VITE_FIREBASE_DATABASE_URL
#   VITE_FIREBASE_PROJECT_ID
#   VITE_FIREBASE_APP_ID

name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Sync Capacitor assets
        run: npm run cap:sync

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SyncTimer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: synctimer-apk
          path: SyncTimer.apk
          if-no-files-found: error

  release:
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: synctimer-apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: SyncTimer.apk
          generate_release_notes: true
