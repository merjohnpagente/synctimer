# Sideload signing key for GitHub-release APKs.
# Committed on purpose so EVERY CI build signs with the SAME key — updates
# then install cleanly over the previous version (no more "App not installed"
# signature conflicts). For Google Play distribution, generate a separate
# private keystore and never commit it.
storeFile=../keystore/synctimer-release.p12
storePassword=synctimer123
keyAlias=1
keyPassword=synctimer123
